name: Windows release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm version "1.0.${env:GITHUB_RUN_NUMBER}" --no-git-tag-version
      - run: node --test tests\desktop-updates.test.mjs tests\desktop-window-menu.test.mjs tests\local-ai.test.mjs tests\local-execution.test.mjs tests\local-run-stream.test.mjs tests\powershell-interactive.test.mjs tests\editor-pairs.test.mjs tests\auto-engine.test.mjs tests\online-preview.test.mjs tests\ai-helper.test.mjs tests\wandbox.test.mjs
      - run: npm run build:windows
      - run: |
          $env:SPRIG_PACKAGED_EXE = (Resolve-Path 'dist\win-unpacked\Sprig.exe').Path
          node --test tests\packaged-runner.test.mjs
          node --test tests\packaged-window.test.mjs --test-name-pattern='packaged executable and window use the Sprig icon'
      - run: |
          $version = "1.0.${env:GITHUB_RUN_NUMBER}"
          gh release create "v$version" "dist\Sprig-Setup-$version.exe" "dist\Sprig-Setup-$version.exe.blockmap" "dist\latest.yml" --target $env:GITHUB_SHA --title "Sprig $version" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
